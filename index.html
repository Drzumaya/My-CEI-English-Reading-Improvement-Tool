<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Career English Institute — CEI</title>
  <meta name="theme-color" content="#0b2545" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CEI English" />
  <link rel="icon" type="image/png" href="./static/LOGO%20CEI%20APP.png" />
  <link rel="apple-touch-icon" href="./static/LOGO%20CEI%20APP.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
    }
    .screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; text-align: center;
    }
    .card {
      background: white; border-radius: 18px; padding: 30px 24px; max-width: 440px; width: 100%;
      box-shadow: 0 10px 30px rgba(11, 37, 69, 0.14); border: 1px solid #e2e8f0;
    }
    .logo {
      width: 112px; height: 112px; border-radius: 22px; margin-bottom: 14px; object-fit: cover;
    }
    h1 {
      font-size: 21px; color: #0b2545; margin-bottom: 6px;
    }
    p.sub {
      font-size: 13.5px; color: #475569; margin-bottom: 22px;
    }
    .btn-primary {
      display: block; text-decoration: none;
      background: linear-gradient(135deg, #0b2545 0%, #1e40af 100%);
      color: white; border-radius: 12px; padding: 16px 20px;
      font-size: 16px; font-weight: 700; width: 100%; cursor: pointer;
      box-shadow: 0 6px 18px rgba(11, 37, 69, 0.28);
      transition: transform 0.15s ease;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      margin-top: 12px; background: #f1f5f9; border: 1px solid #cbd5e1;
      color: #0b2545; border-radius: 12px; padding: 12px 16px;
      font-size: 14px; font-weight: 700; width: 100%; cursor: pointer;
    }
    #hint {
      display: none; margin-top: 14px; background: #fef9c3; border: 1.5px solid #facc15;
      color: #78350f; border-radius: 10px; padding: 12px; font-size: 13.5px;
      line-height: 1.5; text-align: left;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="logo" src="./static/LOGO%20CEI%20APP.png" alt="Logo CEI" />
      <h1>🎓 Career English Institute (CEI)</h1>
      <p class="sub">Global Pedagogical Suite • Agua Prieta, Sonora, México</p>

      <a
        href="https://streamlit.app"
        class="btn-primary"
      >🚀 ABRIR PLATAFORMA ACADÉMICA CEI</a>

      <button id="btnShortcut" type="button" class="btn-secondary">
        📲 Guardar Acceso Directo en Pantalla de Inicio
      </button>

      <div id="hint"></div>
    </div>
  </div>

  <script>
    // Desregistrar cualquier Service Worker previo que forzara el modo standalone bloqueado
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.unregister());
      });
    }

    const btnShortcut = document.getElementById("btnShortcut");
    const hint = document.getElementById("hint");

    btnShortcut.addEventListener("click", () => {
      hint.style.display = "block";
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        hint.innerHTML =
          "📲 <strong>En iPhone / iPad (Safari):</strong><br>" +
          "1. Toca el botón <strong>Compartir (⬆️)</strong> en la barra inferior.<br>" +
          "2. Selecciona <strong>«Agregar a pantalla de inicio»</strong> (se guardará con el escudo oficial de CEI).";
      } else {
        hint.innerHTML =
          "📲 <strong>En Android / PC (Chrome o Edge):</strong><br>" +
          "1. Toca el menú del navegador (<strong>⋮</strong> arriba a la derecha).<br>" +
          "2. Elige <strong>«Agregar a la pantalla principal»</strong> o <strong>«Crear acceso directo»</strong> (se guardará con el escudo oficial de CEI).";
      }
    });
  </script>
</body>
</html>
