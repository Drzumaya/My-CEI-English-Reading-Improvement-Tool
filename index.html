<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CEI English Learning Platform</title>
  <meta name="theme-color" content="#0b2545" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CEI English" />
  <link rel="icon" type="image/png" href="./static/LOGO%20CEI%20APP.png" />
  <link rel="apple-touch-icon" href="./static/LOGO%20CEI%20APP.png" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
    }
    #installScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; background: #f8fafc; text-align: center;
    }
    .card {
      background: white; border-radius: 18px; padding: 28px 22px; max-width: 440px; width: 100%;
      box-shadow: 0 10px 30px rgba(11, 37, 69, 0.14); border: 1px solid #e2e8f0;
    }
    .logo { width: 110px; height: 110px; border-radius: 22px; margin-bottom: 14px; object-fit: cover; }
    h1 { font-size: 20px; color: #0b2545; margin-bottom: 6px; }
    p.sub { font-size: 13.5px; color: #475569; margin-bottom: 20px; }
    #btnInstall {
      background: linear-gradient(135deg, #0b2545 0%, #1e40af 100%);
      color: white; border: none; border-radius: 12px; padding: 16px 20px;
      font-size: 16px; font-weight: 700; width: 100%; cursor: pointer;
      box-shadow: 0 6px 18px rgba(11, 37, 69, 0.28);
      transition: transform 0.15s ease;
    }
    #btnInstall:active { transform: scale(0.98); }
    #hint {
      display: none;
      margin-top: 14px; background: #fef9c3; border: 1.5px solid #facc15;
      color: #78350f; border-radius: 10px; padding: 12px; font-size: 13.5px;
      line-height: 1.5; text-align: left;
    }
    #appFrame {
      display: none; width: 100vw; height: 100vh; border: none;
    }
  </style>
</head>
<body>
  <div id="installScreen">
    <div class="card">
      <img class="logo" src="./static/LOGO%20CEI%20APP.png" alt="Logo CEI" />
      <h1>📲 Instalar App Oficial CEI</h1>
      <p class="sub">Career English Institute • Escudo Institucional Oficial</p>
      <button id="btnInstall" type="button">⬇️ INSTALAR APP OFICIAL CEI</button>
      <a href="https://myceigrammarly.streamlit.app" target="_blank" rel="noopener" style="display:block; margin-top:14px; color:#1e40af; font-size:13.5px; font-weight:700; text-decoration:none;">🌐 Abrir Plataforma Académica CEI en Navegador →</a>
      <div id="hint"></div>
    </div>
  </div>
  <iframe id="appFrame" src="https://myceigrammarly.streamlit.app"></iframe>


    <script>
      const APP_TARGET_URL = "https://streamlit.app";
      const installScreen = document.getElementById("installScreen");
      const appFrame = document.getElementById("appFrame");
      const btnInstall = document.getElementById("btnInstall");
      const hint = document.getElementById("hint");
      let deferredPrompt = null;

      // 1. Si ya se abrió desde el ícono instalado (PWA standalone), cargar la App CEI a pantalla completa
      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      if (isStandalone) {
        installScreen.style.display = "none";
        appFrame.src = APP_TARGET_URL;
        appFrame.style.display = "block";
      }

      // 2. Registrar Service Worker para habilitar instalación PWA con escudo CEI
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstall.disabled = false;
        btnInstall.style.opacity = "1";
        btnInstall.style.cursor = "pointer";
      });

      btnInstall.disabled = false;
      btnInstall.style.cursor = "pointer";

      btnInstall.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (outcome === "accepted") {
            hint.style.display = "block";
            hint.innerHTML =
              "✅ <strong>¡App Oficial CEI instalada!</strong> Búscala en tu pantalla de inicio con el escudo institucional.";
          }
          return;
        }

        hint.style.display = "block";
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          hint.innerHTML =
            "📲 <strong>Para instalar en iPhone / iPad:</strong><br>" +
            "1. Toca el botón <strong>Compartir (⬆️)</strong> en la barra inferior de Safari.<br>" +
            "2. Selecciona <strong>«Agregar a pantalla de inicio»</strong> (con el escudo CEI).";
        } else {
          hint.innerHTML =
            "💻 <strong>Para instalar en tu dispositivo:</strong><br>" +
            "1. Abre el menú de tu navegador (<strong>⋮</strong> o <strong>⋯</strong> arriba a la derecha).<br>" +
            "2. Selecciona <strong>«Instalar App Oficial CEI»</strong> o <strong>«Agregar a pantalla de inicio»</strong>.<br>" +
            "3. O entra directo haciendo clic en el enlace azul de abajo.";
        }
      });
    </script>
  </body>
</html>
