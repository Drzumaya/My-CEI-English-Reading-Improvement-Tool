<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CEI English Learning Platform</title>
  <meta name="theme-color" content="#0b2545" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CEI English" />
  <link rel="icon" type="image/png" href="./static/LOGO%20CEI%20APP.png" />
  <link rel="apple-touch-icon" href="./static/LOGO%20CEI%20APP.png" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
    }
    #installScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; background: #f8fafc; text-align: center;
    }
    .card {
      background: white; border-radius: 18px; padding: 28px 22px; max-width: 440px; width: 100%;
      box-shadow: 0 10px 30px rgba(11, 37, 69, 0.14); border: 1px solid #e2e8f0;
    }
    .logo { width: 110px; height: 110px; border-radius: 22px; margin-bottom: 14px; object-fit: cover; }
    h1 { font-size: 20px; color: #0b2545; margin-bottom: 6px; }
    p.sub { font-size: 13.5px; color: #475569; margin-bottom: 20px; }
    #btnInstall {
      background: linear-gradient(135deg, #0b2545 0%, #1e40af 100%);
      color: white; border: none; border-radius: 12px; padding: 16px 20px;
      font-size: 16px; font-weight: 700; width: 100%; cursor: pointer;
      box-shadow: 0 6px 18px rgba(11, 37, 69, 0.28);
      transition: transform 0.15s ease;
    }
    #btnInstall:active { transform: scale(0.98); }
    #hint {
      display: none;
      margin-top: 14px; background: #fef9c3; border: 1.5px solid #facc15;
      color: #78350f; border-radius: 10px; padding: 12px; font-size: 13.5px;
      line-height: 1.5; text-align: left;
    }
  </style>
</head>
<body>
  <div id="installScreen">
    <div class="card">
      <img class="logo" src="./static/LOGO%20CEI%20APP.png" alt="Logo CEI" />
      <h1>📲 Instalar App Oficial CEI</h1>
      <p class="sub">Career English Institute • Escudo Institucional Oficial</p>
      <button id="btnInstall" type="button">⬇️ INSTALAR APP OFICIAL CEI</button>
      <a href="https://streamlit.app" target="_blank" rel="noopener" style="display:block; margin-top:14px; color:#1e40af; font-size:13.5px; font-weight:700; text-decoration:none;">🌐 Abrir Plataforma Académica CEI en Navegador →</a>
      <div id="hint"></div>
    </div>
  </div>


    <script>
      const APP_TARGET_URL = "https://streamlit.app";
      const btnInstall = document.getElementById("btnInstall");
      const hint = document.getElementById("hint");
      let deferredPrompt = null;
      let tieneVersionAnterior = false;

      // 1. Si ya se abrió desde el ícono instalado (PWA standalone), mostrar logo CEI y abrir plataforma
      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      if (isStandalone) {
        document.querySelector("h1").textContent = "🏛️ Abriendo Plataforma CEI...";
        document.querySelector(".sub").textContent = "Conectando con Career English Institute...";
        btnInstall.style.display = "none";
        setTimeout(() => {
          window.location.href = APP_TARGET_URL;
        }, 450);
      }

      // 2. Detectar si el usuario ya tiene una versión anterior instalada en su dispositivo
      async function verificarVersionAnterior() {
        try {
          if ("getInstalledRelatedApps" in navigator) {
            const appsInstaladas = await navigator.getInstalledRelatedApps();
            if (appsInstaladas && appsInstaladas.length > 0) {
              tieneVersionAnterior = true;
            }
          }
        } catch (e) {}

        if (tieneVersionAnterior && !isStandalone) {
          btnInstall.textContent = "🔄 ACTUALIZAR APP OFICIAL CEI";
          hint.style.display = "block";
          hint.innerHTML =
            "⚠️ <strong>Detectamos una versión anterior de la App CEI instalada en tu dispositivo.</strong><br>" +
            "Para disfrutar de la versión actualizada con el escudo oficial:<br>" +
            "1. <strong>Desinstala o elimina</strong> el acceso directo anterior de tu pantalla de inicio.<br>" +
            "2. Recarga esta página y pulsa <strong>«Instalar App Oficial CEI»</strong>.";
        }
      }

      verificarVersionAnterior();

      // 3. Registrar Service Worker actualizado
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!tieneVersionAnterior) {
          btnInstall.textContent = "⬇️ INSTALAR APP OFICIAL CEI AHORA";
        }
      });

      btnInstall.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (outcome === "accepted") {
            hint.style.display = "block";
            hint.innerHTML =
              "✅ <strong>¡App Oficial CEI instalada!</strong> Búscala en tu pantalla de inicio con el escudo institucional.";
          }
          return;
        }

        hint.style.display = "block";
        if (tieneVersionAnterior) {
          hint.innerHTML =
            "⚠️ <strong>Ya tienes una versión anterior instalada:</strong><br>" +
            "1. Mantén presionado el ícono anterior de CEI en tu celular/PC y elige <strong>Desinstalar / Eliminar</strong>.<br>" +
            "2. Vuelve aquí y recarga la página para instalar la nueva versión limpia.";
          return;
        }

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          hint.innerHTML =
            "📲 <strong>Instalación en iPhone / iPad:</strong><br>" +
            "1. Toca el ícono <strong>Compartir (⬆️)</strong> abajo en Safari.<br>" +
            "2. Elige <strong>«Agregar a pantalla de inicio»</strong> (con el escudo oficial de CEI).";
        } else {
          hint.innerHTML =
            "📲 <strong>Instalación Rápida en tu Navegador:</strong><br>" +
            "1. En la barra de direcciones arriba a la derecha, toca el ícono de <strong>Instalar (⊕ / 💻)</strong> o el menú <strong>⋮ → «Instalar App Oficial CEI»</strong>.<br>" +
            "2. <em>Nota:</em> Si ya tenías una versión previa instalada, desinstálala primero de tu pantalla de inicio y recarga esta página.";
        }
      });
    </script>

 
  </body>
</html>
