name: Generar Iconos Oficiales PWA CEI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Ajustar logo CEI a 192x192 y 512x512 px
        run: |
          python - << 'EOF'
          from pathlib import Path
          from PIL import Image

          static_dir = Path("static")
          candidatos = [
              p for p in static_dir.glob("*")
              if p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"}
              and "launchericon" not in p.name.lower()
          ]
          if not candidatos:
              raise FileNotFoundError(f"No se encontró imagen en static/: {list(static_dir.glob('*'))}")

          origen = next((p for p in candidatos if "logo" in p.name.lower()), candidatos[0])
          print(f"Usando imagen origen: {origen}")

          img = Image.open(origen).convert("RGBA")
          for lado in (192, 512):
              copia = img.copy()
              copia.thumbnail((lado, lado), Image.Resampling.LANCZOS)
              lienzo = Image.new("RGBA", (lado, lado), (11, 37, 69, 255))
              lienzo.paste(copia, ((lado - copia.width) // 2, (lado - copia.height) // 2), copia)
              lienzo.save(static_dir / f"android-launchericon-{lado}-{lado}.png", format="PNG", optimize=True)
          EOF

      - name: Subir iconos como descarga directa (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iconos-pwa-cei
          path: |
            static/android-launchericon-192-192.png
            static/android-launchericon-512-512.png

      - name: Guardar iconos generados en GitHub
        run: |
          git config user.name "CEI Bot"
          git config user.email "bot@cei.edu.mx"
          git add static/android-launchericon-192-192.png static/android-launchericon-512-512.png
          git commit -m "Generar iconos PWA oficiales CEI 192x192 y 512x512" || exit 0
          git push || echo "Nota: Si el push está bloqueado, descarga iconos-pwa-cei desde Artifacts abajo."
