name: CEI Platform CI/CD Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax & Indentation Verification
        run: |
          python -m py_compile ceigrammarly.py core/database.py core/ai_engine.py modules/franchises.py modules/pedagogy.py modules/finance.py

      - name: Run Unit Tests
         run: PYTHONPATH=. pytest -v
  
