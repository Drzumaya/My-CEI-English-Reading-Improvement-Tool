<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEI Portal Socios Afiliados</title>
  <meta name="theme-color" content="#0b2545" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CEI Socios" />
  <link rel="icon" type="image/png" href="./static/LOGO%20CEI%20APP.png" />
  <link rel="apple-touch-icon" href="./static/LOGO%20CEI%20APP.png" />
  <link rel="manifest" href="./manifest_socio.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0b2545 0%, #1e3a8a 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 34px 26px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.32);
    }
    .logo {
      width: 112px; height: 112px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(11, 37, 69, 0.18);
    }
    h1 {
      font-size: 21px;
      color: #0b2545;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13.5px;
      color: #475569;
      margin-bottom: 24px;
    }
    .btn-install {
      display: block;
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #0b2545 0%, #1d4ed8 100%);
      color: #ffffff;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.28);
      transition: transform 0.15s ease;
    }
    .btn-install:active { transform: scale(0.98); }
    .btn-open {
      display: block;
      width: 100%;
      margin-top: 12px;
      text-decoration: none;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      color: #0b2545;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14.5px;
      font-weight: 700;
    }
    .btn-open:hover { background: #e2e8f0; }
    #hint {
      display: none;
      margin-top: 16px;
      background: #fef9c3;
      border: 1.5px solid #facc15;
      color: #78350f;
      border-radius: 12px;
      padding: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      text-align: left;
    }
    .btn-hint-go {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 10px;
      background: #0b2545;
      color: #ffffff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./static/LOGO%20CEI%20APP.png" alt="Logo CEI" />
    <h1>🤝 Portal Socios Afiliados CEI</h1>
    <p class="sub">Career English Institute • Acceso Exclusivo Asociados</p>

    <button id="btnInstall" type="button" class="btn-install">
      ⬇ INSTALAR APP PORTAL SOCIOS (1 CLIC)
    </button>

    <a
      href="https://ceiafiliados.streamlit.app"
      target="_blank"
      rel="noopener noreferrer"
      class="btn-open"
    >🌐 Abrir Portal en el Navegador →</a>

    <div id="hint"></div>
  </div>

  <script>
    const SOCIO_PORTAL_URL = "https://ceiafiliados.streamlit.app";
    const btnInstall = document.getElementById("btnInstall");
    const hint = document.getElementById("hint");
    let deferredPrompt = null;

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
    }

    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
    const params = new URLSearchParams(window.location.search);

    if (isStandalone && !params.get("install")) {
      window.location.replace(SOCIO_PORTAL_URL);
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.textContent = "⬇ INSTALAR APP PORTAL SOCIOS AHORA";
    });

    btnInstall.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === "accepted") {
          hint.style.display = "block";
          hint.innerHTML =
            "✅ <strong>¡App Portal Socios CEI instalada!</strong> Búscala en tu pantalla de inicio como <strong>«CEI Socios»</strong> con el escudo oficial." +
            `<a href="${SOCIO_PORTAL_URL}" target="_blank" rel="noopener noreferrer" class="btn-hint-go">🚀 Abrir Portal de Socios →</a>`;
        }
        return;
      }

      hint.style.display = "block";
      const ua = navigator.userAgent || "";
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const instrucciones = isIOS
        ? "🍎 <strong>iPhone / iPad (Safari):</strong><br>" +
          "1. Toca <strong>Compartir (⬆️)</strong> en la barra inferior.<br>" +
          "2. Selecciona <strong>«Agregar a inicio»</strong> (con el escudo oficial CEI)."
        : "📲 <strong>Android / PC (Chrome o Edge):</strong><br>" +
          "1. Toca los <strong>3 puntos (⋮)</strong> arriba a la derecha.<br>" +
          "2. Selecciona <strong>«Instalar aplicación»</strong> o <strong>«Agregar a la pantalla principal»</strong>.";

      hint.innerHTML =
        instrucciones +
        `<a href="${SOCIO_PORTAL_URL}" target="_blank" rel="noopener noreferrer" class="btn-hint-go">🚀 Entrar Directo al Portal de Socios →</a>`;
    });
  </script>
</body>
</html>
